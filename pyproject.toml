[tool.uv.workspace]
members = [
  "contracts",
  "lib",
  "mocks",
  "ws1-channels",
  "ws1-channels/voice_worker",
  "ws2-spine",
  "ws2-spine/agent",
  "ws3-identity",
  "ws4-billing",
  "ws5-legal",
  "ws6-research",
  "ws7-numbers",
  "ws8-tenant",
  "ws9-data",
  "ws10-ops",
  "infra",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "hypothesis>=6",
  "ruff>=0.9",
  "mypy>=1.13",
  "moto[all]>=5",
  "boto3>=1.35",
  "pydantic>=2.10",
  "jsonschema>=4.23",
  "cfn-lint>=1.3",
  "pre-commit>=4",
  "aws-cdk-lib>=2.177",
  "constructs>=10.3",
  "cdk-nag>=2.28",
  "pyyaml>=6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E","W","F","I","UP","B","S","A"]
ignore = ["S101","S105","S106","S107"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

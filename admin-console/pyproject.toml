[project]
name = "cx-admin"
version = "0.1.0"
description = "1145cx admin console"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "boto3==1.35.76",
    "pydantic==2.10.3",
    "cx-contracts",
    "cx-lib",
]

[tool.uv.sources]
cx-contracts = { workspace = true }
cx-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

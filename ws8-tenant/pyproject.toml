[project]
name = "cx-ws8-tenant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cx-lib", "cx-contracts", "boto3>=1.35", "pydantic>=2.10"]
[tool.uv.sources]
cx-lib = {workspace = true}
cx-contracts = {workspace = true}
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/cx_ws8_tenant"]

[project]
name = "cx-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.3",
  "langchain-aws>=0.2",
  "pydantic>=2.10",
]
[dependency-groups]
dev = []
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["nodes", "prompts"]

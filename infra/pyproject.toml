[project]
name = "cx-infra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aws-cdk-lib>=2.177",
  "constructs>=10.3",
  "cdk-nag>=2.28",
  "pydantic>=2.10",
  "pyyaml>=6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["."]

name: Deploy Sandbox
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: astral-sh/setup-uv@v5
        with: {python-version: '3.12'}
      - run: uv sync --all-packages && npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_SANDBOX }}
          aws-region: us-east-1
      - run: cd infra && npx cdk deploy --all -c env=sandbox --require-approval never

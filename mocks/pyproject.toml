[project]
name = "cx-mocks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cx-contracts", "cx-lib", "pydantic>=2.10"]
[tool.uv.sources]
cx-contracts = {workspace = true}
cx-lib = {workspace = true}
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/cx_mocks"]

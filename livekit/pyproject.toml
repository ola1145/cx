[project]
name = "cx-livekit"
version = "0.1.0"
description = "1145cx LiveKit room manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "boto3==1.35.76",
    "pydantic==2.10.3",
    "livekit==0.13.1",
    "livekit-api==0.7.1",
    "cx-contracts",
    "cx-lib",
]

[tool.uv.sources]
cx-contracts = { workspace = true }
cx-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
